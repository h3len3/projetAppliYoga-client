<h1>Cliquez pour réserver</h1>

<div class="grid m-3">
    <div class="col-12">
        <full-calendar [options]="calendarOptions" [events]="events"></full-calendar>
    </div>
</div>

<p-dialog [style]="{ width: '50rem' }" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [maximizable]="true" [(visible)]="popupVisible" header="Event Form" modal="true" (onHide)="onClose()" >
  @if(event) {
    <app-popupbooking [event]="event"></app-popupbooking>
  }
</p-dialog>
<p-toast></p-toast>
<p-confirm-dialog></p-confirm-dialog>
