
<h1>Mon calendrier</h1>

<div class="grid m-3">
    <div class="col-12">
        <full-calendar [options]="calendarOptions" [events]="events"></full-calendar>
    </div>
</div>

    <p-dialog [(visible)]="popupVisible" [style]="{ width: '50vw' }" [maximizable]="true" (onHide)="popupVisible = false">
    <app-pop-up-event [date]="selectedDate"></app-pop-up-event>
</p-dialog>
